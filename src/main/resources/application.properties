spring.application.name=aqualink

spring.datasource.url=${AQUALINK_DB_URL:jdbc:mysql://localhost:3306/aqualink}
spring.datasource.username=${AQUALINK_DB_USERNAME:root}
spring.datasource.password=${AQUALINK_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate

server.port=8080