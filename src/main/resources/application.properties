spring.application.name=aqualink

spring.datasource.url=${AQUALINK_DB_URL:jdbc:mysql://localhost:3306/aqualink?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&sslMode=DISABLED}
spring.datasource.username=${AQUALINK_DB_USERNAME:root}
spring.datasource.password=${AQUALINK_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update

server.port=8080

aqualink.sms.twilio.account-sid=${AQUALINK_TWILIO_ACCOUNT_SID:}
aqualink.sms.twilio.auth-token=${AQUALINK_TWILIO_AUTH_TOKEN:}
aqualink.sms.twilio.from-number=${AQUALINK_TWILIO_FROM_NUMBER:}
aqualink.sms.twilio.webhook-url=${AQUALINK_TWILIO_WEBHOOK_URL:}

aqualink.ai.api-key=${AQUALINK_AI_API_KEY:}
aqualink.ai.base-url=${AQUALINK_AI_BASE_URL:https://api.openai.com/v1}
aqualink.ai.model=${AQUALINK_AI_MODEL:gpt-4o-mini}